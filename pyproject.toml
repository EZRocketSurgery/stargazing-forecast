[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stargazing-forecast"
version = "0.1.0"
description = "Find the best upcoming hours for stargazing at a location, using WeatherAPI forecasts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.2,<2",
    "requests>=2.33,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stargazing = "stargazing.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
